[pytest]
asyncio_mode = auto
addopts = -m "not integration" --import-mode=prepend -p no:freezegun
pythonpath = .
testpaths = tests
markers =
    integration: tests that call live broker/data APIs or run slow historical backtests
python_files =
    test_*.py
    scratch_test.py
norecursedirs =
    .benchmarks
    .pytest_cache
    .zenflow
    archive
    data_store
    logs
    pytest-tmp-base
    pytest-tmp-base.*
    restore_point_*
    scratch
    venv
filterwarnings =
    # FYERS 3.1.12 through current 3.1.18 still imports pkg_resources internally.
    ignore:pkg_resources is deprecated as an API:DeprecationWarning:fyers_apiv3\.FyersWebsocket\.data_ws
